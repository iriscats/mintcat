[package]
name = "mintcat-integrator-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = { version = "2.2.0", default-features = false, features = ["aes-crypto", "deflate", "time"] }
repak = { git = "https://github.com/trumank/repak", features = ["oodle"] }
typed-path = "0.8"
unicase = "2.7"
unreal_asset = { git = "https://github.com/trumank/unrealmodding", branch = "patches" }
steamlocate = "2.0.1"
byteorder = "1.5"
cityhasher = "0.1"
indexmap = "2"
log = "0.4.27"
tracing = { version = "0.1.41", features = ["attributes"] }

[dev-dependencies]
tempfile = "3"

